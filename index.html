<!doctype html>
<html lang="bs" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SellerOS" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />

    <!-- SEO -->
    <meta name="description" content="SellerOS — Sve vaše narudžbe na jednom mjestu. Upravljajte narudžbama, kupcima, lagerom i dostavom sa svih prodajnih kanala iz jednog mjesta." />
    <meta name="robots" content="index, follow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="SellerOS — Sve vaše narudžbe na jednom mjestu" />
    <meta property="og:description" content="Upravljajte narudžbama, kupcima, lagerom i dostavom sa svih prodajnih kanala iz jednog mjesta." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SellerOS — Sve vaše narudžbe na jednom mjestu" />
    <meta name="twitter:description" content="Upravljajte narudžbama, kupcima, lagerom i dostavom sa svih prodajnih kanala iz jednog mjesta." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <title>SellerOS — Sve vaše narudžbe na jednom mjestu</title>

    <!-- Theme init (flicker-free) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('shopos-theme');
          if (t === 'dark') {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#111318');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
