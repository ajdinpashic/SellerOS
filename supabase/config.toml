# SellerOS — Supabase local development configuration
# Generated for the Supabase CLI. `supabase start` uses this file.
# See BACKEND.md for the full local development workflow.

project_id = "selleros"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/#/reset-password"]
jwt_expiry = 3600
enable_signup = true

# Security hardening for auth (rate limiting is on by default in
# Supabase Auth; keep signup verification on for production).
[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = true

# Edge functions (server-side only code — never client keys here)
[edge_runtime]
enabled = true
policy = "oneshot"

[functions.integrations-webhook]
verify_jwt = false
